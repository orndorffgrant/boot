# SPDX-License-Identifier: AGPL-3.0-or-later

# Dependency license policy. Run `cargo deny check licenses`.
[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# GPL-2.0-only is deliberately absent: it cannot be combined with AGPLv3.
# LGPL and other weak-copyleft licenses need a relinking/source review, so they
# should be added as per-crate exceptions rather than globally.
exceptions = []

[licenses.private]
ignore = true
