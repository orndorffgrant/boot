[build]
default-target = "aarch64-unknown-linux-gnu"

[build.env]
passthrough = [
    "BOOT_DEPENDENCY_SOURCE_META",
    "BOOT_DEPENDENCY_SOURCE_REQUIRED",
    "BOOT_SOURCE_REQUIRED",
    "BOOT_SOURCE_TARBALL",
]

[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:latest"
pre-build = [
    "apt-get update",
    "apt-get install -y libudev-dev pkg-config"
]

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:latest"
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install -y libudev-dev:arm64 pkg-config"
]

[target.aarch64-unknown-linux-gnu.env]
passthrough = [
    "PKG_CONFIG_ALLOW_CROSS=1",
    "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig",
    "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu",
]
