[workspace]
resolver = "2"
members = [
    "boot-api",
    "boot-api-client",
    "boot-cli",
]

[workspace.dependencies]
# Shared external dependencies
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
defmt-decoder = { version = "0.3", features = ["unstable"] }
defmt-parser = "0.3"
directories = "5.0"
dropshot = "0.16"
futures = "0.3"
http = "1.4"
indicatif = "0.17"
progenitor = "0.11"
progenitor-client = "0.11"
prettyplease = "0.2"
probe-rs = "0.30"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
schemars = "0.8"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.5"
syn = "2.0"
tokio = { version = "1.48", features = ["full"] }
tokio-tungstenite = "0.24"

# Workspace crates
boot-api = { path = "boot-api", default-features = false }
boot-api-client = { path = "boot-api-client" }
