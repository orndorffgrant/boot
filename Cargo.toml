[workspace]
resolver = "2"
members = [
    "boot-api",
    "boot-api-client",
    "boot-cli",
]

[workspace.dependencies]
# Shared external dependencies
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
comfy-table = "8.0"
defmt-decoder = { version = "1.2", features = ["unstable"] }
defmt-parser = "1.1"
directories = "6.0"
dropshot = "0.17"
futures = "0.3"
http = "1.5"
hyper-util = { version = "0.1", features = ["tokio"] }
indicatif = "0.18"
object = "0.40"
os_pipe = "1.2"
# The "macro" feature is unused (build.rs calls Generator directly) and pulls
# deprecated serde_yaml/unsafe-libyaml.
progenitor = { version = "0.15", default-features = false }
progenitor-client = "0.15"
prettyplease = "0.3"
probe-rs = "0.32"
probe-rs-debug = "0.32"
rand = "0.10"
tokio-util = { version = "0.7", features = ["codec"] }
schemafy = "0.6"
addr2line = "0.27"
capstone = "0.14"
svd-parser = "0.14.10"
# reqwest 0.13 renamed the "rustls-tls" feature to "rustls"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
# Pinned to 0.8 because dropshot and progenitor both generate schemas with schemars 0.8
schemars = "0.8"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.10"
syn = "3.0"
tokio = { version = "1.54", features = ["full"] }
tokio-tungstenite = "0.30"

# Workspace crates
boot-api = { path = "boot-api", default-features = false }
boot-api-client = { path = "boot-api-client" }
