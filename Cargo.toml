[workspace]
resolver = "2"
members = [
    "goose-api",
    "goose-api-client",
    "goose-cli",
]

[workspace.dependencies]
# Shared external dependencies
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
directories = "5.0"
dropshot = "0.16"
futures = "0.3"
http = "1.4"
progenitor = "0.11"
progenitor-client = "0.11"
prettyplease = "0.2"
probe-rs = "0.30"
reqwest = { version = "0.12", features = ["json", "stream"] }
schemars = "0.8"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = "2.0"
tokio = "1.48"

# Workspace crates
goose-api = { path = "goose-api" }
goose-api-client = { path = "goose-api-client" }
