name: Debug failed release logs

on:
  push:
    branches:
      - main

permissions:
  actions: read
  checks: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Download failed logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          curl -sS -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/orndorffgrant/boot/actions/jobs/128104728533/logs" \
            -o job.zip
          echo "curl exit: $?"
          file job.zip
          unzip -o job.zip -d logs
          echo "unzip exit: $?"
          find logs -maxdepth 2 -type f -print
          cat logs/* > failed.log 2>/dev/null
          cat job.zip >> failed.log
          wc -c failed.log

      - name: Publish logs as a check run
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('failed.log', 'utf8');
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'debug-failed-logs',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: 'Failed release logs',
                summary: log.slice(-60000) || '(no log output)',
              },
            });
